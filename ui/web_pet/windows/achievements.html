<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>成就与奖章</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;background:#f6efe6;color:#333}
header{background:#fff;padding:14px 20px;border-bottom:1px solid #eee} header h1{margin:0;font-size:18px}
#stats{display:flex;gap:12px;padding:14px 20px 0}
.stat{background:#fff;border-radius:12px;padding:14px 18px;flex:1;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.stat .v{font-size:22px;font-weight:bold;color:#e07a2f} .stat .l{font-size:12px;color:#888;margin-top:2px}
.bar{height:6px;background:#f0e6da;border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:#e07a2f;border-radius:4px}
#content{padding:14px 20px}
.group{background:#fff;border-radius:12px;padding:14px 18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.group h2{margin:0 0 10px;font-size:14px;color:#e07a2f;border-bottom:1px solid #f2e8da;padding-bottom:6px}
.medals{display:flex;flex-wrap:wrap;gap:14px}
.medal{width:110px;text-align:center}
.medal .ring{width:74px;height:74px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;position:relative}
.medal.on .ring{background:linear-gradient(135deg,#ffd166,#f6b93b);box-shadow:0 3px 10px rgba(246,185,59,.4)}
.medal.off .ring{background:#eee;filter:grayscale(1);opacity:.7}
.medal .nm{font-size:12px;font-weight:bold;margin-top:6px}
.medal .ds{font-size:10px;color:#999;margin-top:2px;line-height:1.3}
.medal .st{font-size:10px;color:#2e8b57;margin-top:2px}
</style></head>
<body><header><h1>成就与奖章</h1></header>
<div id="stats"></div><div id="content"></div>
<script>
"use strict";
const PORT=(window.api&&window.api.pyPort)||""; const BASE="http://127.0.0.1:"+PORT;
async function load(){
  try{
    const d=await fetch(BASE+"/api/achievements").then(r=>r.json());
    renderStats(d.stats||{});
    const c=document.getElementById("content"); c.innerHTML="";
    // 每日/每周/每月 奖章
    (d.medal_types||[]).forEach(([type,tname])=>{
      const items=(d.medals||[]).filter(m=>m.type===type);
      const st=(d.medal_status||[]).find(x=>x.type===type);
      const sec=document.createElement("div"); sec.className="group";
      sec.innerHTML="<h2>"+tname+"</h2><div class='medals'></div>";
      const box=sec.querySelector(".medals");
      items.forEach(m=>{
        const on=!!(d.medal_status||[]).find(x=>x.id===m.id&&x.unlocked);
        const el=document.createElement("div"); el.className="medal "+(on?"on":"off");
        el.innerHTML=`<div class="ring">${m.icon}</div><div class="nm">${m.name}</div><div class="ds">${m.desc}</div><div class="st">${on?"✔ 已获得":""}</div>`;
        box.appendChild(el);
      });
      c.appendChild(sec);
    });
    // 里程碑（长期累计成就）
    const sec=document.createElement("div"); sec.className="group";
    sec.innerHTML="<h2>里程碑</h2><div class='medals'></div>";
    const box=sec.querySelector(".medals");
    (d.achievements||[]).forEach(a=>{
      const on=!!d.unlocked[a.id];
      const el=document.createElement("div"); el.className="medal "+(on?"on":"off");
      el.innerHTML=`<div class="ring">${a.icon}</div><div class="nm">${a.name}</div><div class="ds">${a.desc}</div><div class="st">${on?"✔ 已解锁":""}</div>`;
      box.appendChild(el);
    });
    c.appendChild(sec);
  }catch(e){document.getElementById("content").innerHTML="<p style='padding:20px;color:#c00'>无法连接桌宠</p>";}
}
function renderStats(st){
  const s=document.getElementById("stats"); s.innerHTML="";
  const items=[["今日专注",Math.round(st.today_focus||0),30,"分"],["本周专注",Math.round(st.week_focus||0),300,"分"],["本月专注",Math.round(st.month_focus||0),1200,"分"]];
  items.forEach(([l,v,target,u])=>{
    const d=document.createElement("div"); d.className="stat";
    const pct=Math.min(100, Math.round((v||0)/target*100));
    d.innerHTML=`<div class="v">${v}<small> ${u||""}</small></div><div class="l">${l} / 目标 ${target}</div><div class="bar"><i style="width:${pct}%"></i></div>`;
    s.appendChild(d);
  });
}
load();
</script></body></html>
